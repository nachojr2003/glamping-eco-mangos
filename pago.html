<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Pagar mi reserva · Glamping Eco Mangos</title>
<link rel="icon" href="https://cdn.jsdelivr.net/gh/nachojr2003/eco-mangos-widget@main/images/logo.jpg">
<style>
  :root{ --verde:#2D6B27; --verde2:#3a7a32; --ambar:#F5A21C; --tinta:#22421F; --texto:#4C4B42;
         --suave:#F2F7F0; --linea:#ECE8DD; --fondo:#EFEBE0; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--fondo); color:var(--texto);
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:520px; margin:0 auto; padding:20px 16px 48px; }
  .card{ background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 2px 14px rgba(0,0,0,.07); }
  .head{ background:var(--verde); border-bottom:4px solid var(--ambar); padding:22px 20px; text-align:center; color:#fff; }
  .head img{ width:56px; height:56px; border-radius:50%; display:block; margin:0 auto 10px; }
  .head b{ font-size:16px; letter-spacing:1px; font-weight:800; }
  .head span{ display:block; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#CBE3C6; margin-top:3px; }
  .body{ padding:24px 22px 26px; }
  h1{ font-size:21px; line-height:1.3; color:var(--tinta); margin:0 0 6px; font-weight:800; }
  p{ margin:0 0 14px; font-size:14.5px; line-height:1.55; }
  .muted{ color:#8A8578; font-size:12.5px; }
  .aviso{ background:#FDF3DE; border-left:4px solid var(--ambar); border-radius:0 8px 8px 0;
          padding:12px 14px; font-size:13.5px; line-height:1.5; color:#6B4E12; margin:0 0 18px; }
  .aviso b{ color:#513A0A; }
  .monto{ text-align:center; margin:20px 0 6px; }
  .monto .lbl{ font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#8A8578; }
  .monto .val{ font-size:40px; font-weight:800; color:var(--verde); line-height:1.1; margin-top:4px; }
  .resumen{ background:var(--suave); border-radius:12px; padding:16px 18px; margin:20px 0 0; }
  .resumen .cod{ font-size:10.5px; letter-spacing:2px; text-transform:uppercase; font-weight:700; color:#57724F; margin-bottom:8px; }
  .row{ display:flex; justify-content:space-between; gap:12px; padding:5px 0; font-size:14px; }
  .row span:first-child{ color:#5C6657; }
  .row span:last-child{ font-weight:700; color:#2A3A26; text-align:right; }
  .btn{ display:block; width:100%; border:0; border-radius:11px; background:var(--verde); color:#fff;
        font-size:16.5px; font-weight:700; padding:16px 18px; cursor:pointer; margin-top:20px;
        font-family:inherit; transition:background .15s; }
  .btn:hover:not(:disabled){ background:var(--verde2); }
  .btn:disabled{ opacity:.55; cursor:default; }
  .btn.ghost{ background:transparent; color:var(--verde); border:2px solid var(--verde); }
  .estado{ text-align:center; padding:8px 0 0; }
  .ico{ width:64px; height:64px; border-radius:50%; margin:0 auto 14px; display:flex; align-items:center;
        justify-content:center; font-size:32px; font-weight:800; color:#fff; }
  .ico.ok{ background:var(--verde); } .ico.warn{ background:var(--ambar); color:#33260A; } .ico.bad{ background:#B4483A; }
  .spin{ width:34px; height:34px; border:3px solid #DDE8D9; border-top-color:var(--verde);
         border-radius:50%; animation:g 0.9s linear infinite; margin:26px auto; }
  @keyframes g{ to{ transform:rotate(360deg); } }
  .pie{ text-align:center; margin-top:18px; font-size:12px; line-height:1.6; color:#8A8578; }
  .pie a{ color:#57724F; }
  .seguro{ text-align:center; font-size:11.5px; color:#A8A396; margin-top:12px; }
  .hide{ display:none !important; }
  .err{ background:#FBEDEB; border-left:4px solid #B4483A; border-radius:0 8px 8px 0; padding:12px 14px;
        font-size:13.5px; line-height:1.5; color:#7C2D22; margin:16px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head">
      <img src="https://cdn.jsdelivr.net/gh/nachojr2003/eco-mangos-widget@main/images/logo.jpg" alt="Glamping Eco Mangos">
      <b>GLAMPING ECO MANGOS</b>
      <span>Cieneguilla · Lima</span>
    </div>
    <div class="body">
      <div id="cargando"><div class="spin"></div><p class="muted" style="text-align:center">Cargando tu reserva…</p></div>
      <div id="vista" class="hide"></div>
    </div>
  </div>
  <div class="pie">
    ¿Necesitas ayuda? Escríbenos al WhatsApp
    <a href="https://wa.me/51929790568" target="_blank" rel="noopener"><b>929 790 568</b></a><br>
    Glamping Eco Mangos · Cieneguilla, Lima, Perú
  </div>
</div>

<script src="https://checkout.culqi.com/js/v4"></script>
<script>
(function(){
  var API   = 'https://meta.ijvagency.com/webhook';
  var PK    = 'pk_test_tBqVvYwQvDRRhABo';
  var LOGO  = 'https://cdn.jsdelivr.net/gh/nachojr2003/eco-mangos-widget@main/images/logo.jpg';

  var ord = (new URLSearchParams(location.search)).get('ord') || '';
  var $carg = document.getElementById('cargando');
  var $vista = document.getElementById('vista');
  var info = null, tickTimer = null, pollTimer = null;

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function soles(n){ return 'S/ ' + (Number(n||0)).toFixed(2).replace(/\.00$/,''); }
  function pintar(html){ $carg.classList.add('hide'); $vista.innerHTML = html; $vista.classList.remove('hide'); }

  function resumenHTML(d){
    var filas = [
      ['Carpa', d.carpa],
      ['Ingreso (check-in)', d.llegada],
      ['Salida (check-out)', d.salida],
      ['Noches', d.noches],
      ['Personas', d.pax]
    ].filter(function(f){ return f[1]; });
    return '<div class="resumen"><div class="cod">Reserva · ' + esc(d.codigo) + '</div>' +
      filas.map(function(f){
        return '<div class="row"><span>' + esc(f[0]) + '</span><span>' + esc(f[1]) + '</span></div>';
      }).join('') + '</div>';
  }

  function cuentaRegresiva(epoch){
    var el = document.getElementById('reloj');
    if (!el) return;
    function tick(){
      var s = epoch - Math.floor(Date.now()/1000);
      if (s <= 0){
        el.innerHTML = 'Tu enlace venció, pero <b>la carpa sigue apartada</b>. Puedes completar el pago ahora mismo.';
        clearInterval(tickTimer); return;
      }
      var h = Math.floor(s/3600), m = Math.floor((s%3600)/60), g = s%60;
      el.innerHTML = 'Tu carpa queda apartada por <b>' +
        (h ? h + ' h ' : '') + m + ' min ' + (h ? '' : g + ' s') + '</b>. Pasado ese tiempo vuelve a estar disponible para otras personas.';
    }
    tick(); tickTimer = setInterval(tick, 1000);
  }

  function vistaPago(d, suave){
    var monto = (d.monto_centimos || 0) / 100;
    pintar(
      '<h1>Hola ' + esc(String(d.nombre||'').split(' ')[0]) + ', asegura tu escapada</h1>' +
      '<p>Paga el adelanto y la carpa <b>' + esc(d.carpa) + '</b> queda reservada a tu nombre.</p>' +
      '<div class="aviso" id="reloj"></div>' +
      '<div class="monto"><div class="lbl">Adelanto para confirmar</div>' +
        '<div class="val">' + soles(monto) + '</div>' +
        (d.total ? '<p class="muted" style="margin-top:8px">Es el 50% del total de ' + soles(d.total) +
          '. El saldo de ' + soles(d.saldo) + ' lo pagas en el glamping el día de tu ingreso.</p>' : '') +
      '</div>' +
      resumenHTML(d) +
      '<button class="btn" id="btnPagar">Pagar ' + soles(monto) + '</button>' +
      '<div id="errzone"></div>' +
      '<div class="seguro">Pago seguro procesado por Culqi · Tarjeta, Yape y más</div>'
    );
    cuentaRegresiva(d.vence_epoch || 0);
    document.getElementById('btnPagar').addEventListener('click', abrirCheckout);
  }

  function vistaPagada(d){
    pintar('<div class="estado"><div class="ico ok">&#10003;</div>' +
      '<h1 style="text-align:center">Tu reserva está confirmada</h1>' +
      '<p style="text-align:center">Recibimos tu adelanto' + (d.fecha_pago ? ' el ' + esc(d.fecha_pago) : '') +
      '. Te enviamos el comprobante por correo.</p></div>' +
      resumenHTML(d) +
      (d.saldo ? '<p class="muted" style="text-align:center;margin-top:16px">Saldo a pagar en el glamping: <b>' +
        soles(d.saldo) + '</b></p>' : '') +
      '<a class="btn ghost" style="text-decoration:none;text-align:center" href="https://wa.me/51929790568" target="_blank" rel="noopener">Coordinar detalles por WhatsApp</a>');
  }

  function vistaAviso(titulo, texto, tipo){
    pintar('<div class="estado"><div class="ico ' + (tipo||'warn') + '">!</div>' +
      '<h1 style="text-align:center">' + esc(titulo) + '</h1>' +
      '<p style="text-align:center">' + texto + '</p></div>' +
      '<a class="btn" style="text-decoration:none;text-align:center" href="https://wa.me/51929790568" target="_blank" rel="noopener">Escribirnos al WhatsApp</a>');
  }

  function procesando(){
    $vista.innerHTML = '<div class="spin"></div><p class="muted" style="text-align:center">Confirmando tu pago… no cierres esta página.</p>';
  }

  // ---------- Culqi Checkout ----------
  function abrirCheckout(){
    if (typeof Culqi === 'undefined'){
      mostrarError('No pudimos cargar la pasarela de pago. Revisa tu conexión y recarga la página.'); return;
    }
    Culqi.publicKey = PK;
    Culqi.settings({
      title: 'Glamping Eco Mangos',
      currency: 'PEN',
      amount: info.monto_centimos,
      order: info.order_id
    });
    Culqi.options({
      lang: 'auto',
      installments: false,
      paymentMethods: { tarjeta:true, yape:true, bancaMovil:true, agente:true, billetera:true, cuotealo:false },
      style: { logo: LOGO, bannerColor:'#2D6B27', buttonBackground:'#2D6B27', buttonText:'Pagar adelanto' }
    });
    Culqi.open();
  }

  function mostrarError(msg){
    var z = document.getElementById('errzone');
    if (z) z.innerHTML = '<div class="err">' + esc(msg) + '</div>';
    var b = document.getElementById('btnPagar');
    if (b){ b.disabled = false; b.textContent = 'Reintentar el pago'; }
  }

  window.culqi = function(){
    if (Culqi.token){
      var token = Culqi.token.id;
      Culqi.close();
      procesando();
      fetch(API + '/ecomangos-pago-cargo', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ ord: info.order_id, token: token })
      }).then(function(r){ return r.json(); }).then(function(res){
        if (res && res.exito){ cargar(); }
        else { vistaPago(info); mostrarError((res && res.mensaje) || 'El pago no pudo completarse.'); }
      }).catch(function(){
        // El cobro pudo haber salido: nunca damos el pago por fallido sin verificar.
        procesando(); esperarConfirmacion();
      });
    } else if (Culqi.order){
      // Yape / agente / banca movil: Culqi confirma por su lado.
      Culqi.close(); procesando(); esperarConfirmacion();
    } else if (Culqi.error){
      Culqi.close();
      mostrarError(Culqi.error.user_message || 'No pudimos procesar el pago.');
    }
  };

  // Consulta el estado hasta que el servidor confirme (o se agoten los intentos).
  function esperarConfirmacion(){
    var intentos = 0;
    clearInterval(pollTimer);
    pollTimer = setInterval(function(){
      intentos++;
      fetch(API + '/ecomangos-pago-info?ord=' + encodeURIComponent(ord))
        .then(function(r){ return r.json(); }).then(function(d){
          if (d && d.estado === 'pagada'){ clearInterval(pollTimer); info = d; vistaPagada(d); }
          else if (intentos >= 20){
            clearInterval(pollTimer);
            vistaAviso('Estamos verificando tu pago',
              'Si ya lo completaste, lo confirmaremos en unos minutos y te llegará el correo. Si tienes dudas, escríbenos.', 'warn');
          }
        }).catch(function(){});
    }, 4000);
  }

  // ---------- Carga inicial ----------
  function cargar(){
    if (!/^ord_(test|live)_[A-Za-z0-9]+$/.test(ord)){
      pintar(''); vistaAviso('Enlace no válido', 'Este enlace de pago no es correcto o está incompleto.', 'bad'); return;
    }
    fetch(API + '/ecomangos-pago-info?ord=' + encodeURIComponent(ord))
      .then(function(r){ return r.json(); })
      .then(function(d){
        info = d;
        if (!d || !d.estado){ vistaAviso('No pudimos cargar tu reserva', 'Vuelve a intentarlo en unos segundos.', 'bad'); return; }
        if (d.estado === 'pagada')  return vistaPagada(d);
        if (d.estado === 'liberada')
          return vistaAviso('Esta reserva fue liberada',
            'No se registró el pago dentro del plazo y la carpa volvió a estar disponible. Escríbenos y vemos si sigue libre.', 'warn');
        if (d.estado === 'no_encontrado' || d.estado === 'link_invalido')
          return vistaAviso('No encontramos esta reserva', esc(d.mensaje || 'Escríbenos y te ayudamos.'), 'bad');
        vistaPago(d);
      })
      .catch(function(){
        vistaAviso('No pudimos conectar', 'Revisa tu conexión e intenta recargar la página.', 'bad');
      });
  }
  cargar();
})();
</script>
</body>
</html>
