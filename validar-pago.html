<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Validar pago · Glamping Eco Mangos</title>
<link rel="icon" href="https://cdn.jsdelivr.net/gh/nachojr2003/eco-mangos-widget@main/images/logo.jpg">
<!--
  Página del EQUIPO de Eco Mangos (no del huésped). Llega por el botón del correo "Pago por verificar".
  El enlace trae ?c=<código EM-...>&t=<token>. El token es de un solo uso y sirve solo para esa reserva:
  n8n compara su SHA-256 con la columna U del Sheet (workflow "API - Validar Pago [Eco Mangos]").
  Aquí no hay ninguna clave ni dato del negocio: todo lo decide el servidor.
-->
<style>
  :root{ --verde:#2D6B27; --verde2:#3a7a32; --ambar:#F5A21C; --tinta:#22421F; --texto:#4C4B42;
         --suave:#F2F7F0; --linea:#ECE8DD; --fondo:#EFEBE0; --rojo:#B4483A; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--fondo); color:var(--texto);
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:520px; margin:0 auto; padding:20px 16px 48px; }
  .card{ background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 2px 14px rgba(0,0,0,.07); }
  .head{ background:var(--verde); border-bottom:4px solid var(--ambar); padding:18px 20px; text-align:center; color:#fff; }
  .head b{ font-size:15px; letter-spacing:1px; font-weight:800; }
  .head span{ display:block; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#CBE3C6; margin-top:3px; }
  .body{ padding:22px 20px 24px; }
  h1{ font-size:20px; line-height:1.3; color:var(--tinta); margin:0 0 6px; font-weight:800; }
  p{ margin:0 0 14px; font-size:14.5px; line-height:1.55; }
  .muted{ color:#8A8578; font-size:12.5px; }
  .monto{ text-align:center; margin:18px 0 4px; }
  .monto .lbl{ font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#8A8578; }
  .monto .val{ font-size:38px; font-weight:800; color:var(--verde); line-height:1.1; margin-top:4px; }
  .resumen{ background:var(--suave); border-radius:12px; padding:14px 16px; margin:16px 0 0; }
  .resumen .cod{ font-size:10.5px; letter-spacing:2px; text-transform:uppercase; font-weight:700; color:#57724F; margin-bottom:6px; }
  .row{ display:flex; justify-content:space-between; gap:12px; padding:5px 0; font-size:14px; }
  .row span:first-child{ color:#5C6657; }
  .row span:last-child{ font-weight:700; color:#2A3A26; text-align:right; overflow-wrap:anywhere; }
  label{ display:block; font-size:13px; font-weight:700; color:var(--tinta); margin:18px 0 6px; }
  input{ width:100%; font-size:16px; padding:12px; border:1.5px solid #D8D3C4; border-radius:10px; font-family:inherit; }
  .btn{ display:block; width:100%; border:0; border-radius:11px; background:var(--verde); color:#fff;
        font-size:16.5px; font-weight:700; padding:16px 18px; cursor:pointer; margin-top:14px; font-family:inherit; }
  .btn:disabled{ opacity:.55; cursor:default; }
  .btn.rojo{ background:transparent; color:var(--rojo); border:2px solid var(--rojo); }
  .paso{ background:#FDF3DE; border-left:4px solid var(--ambar); border-radius:0 8px 8px 0;
         padding:12px 14px; font-size:13.5px; line-height:1.5; color:#6B4E12; margin:16px 0 0; }
  .estado{ text-align:center; padding:6px 0 0; }
  .ico{ width:60px; height:60px; border-radius:50%; margin:0 auto 12px; display:flex; align-items:center;
        justify-content:center; font-size:30px; font-weight:800; color:#fff; }
  .ico.ok{ background:var(--verde); } .ico.warn{ background:var(--ambar); color:#33260A; } .ico.bad{ background:var(--rojo); }
  .spin{ width:34px; height:34px; border:3px solid #DDE8D9; border-top-color:var(--verde);
         border-radius:50%; animation:g .9s linear infinite; margin:26px auto; }
  @keyframes g{ to{ transform:rotate(360deg); } }
  .err{ background:#FBEDEB; border-left:4px solid var(--rojo); border-radius:0 8px 8px 0; padding:12px 14px;
        font-size:13.5px; line-height:1.5; color:#7C2D22; margin:16px 0 0; }
  .hide{ display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head"><b>GLAMPING ECO MANGOS</b><span>Validación de pagos · uso interno</span></div>
    <div class="body">
      <div id="cargando"><div class="spin"></div><p class="muted" style="text-align:center">Cargando la reserva…</p></div>
      <div id="vista" class="hide"></div>
    </div>
  </div>
</div>

<script>
(function(){
  var API = 'https://meta.ijvagency.com/webhook/ecomangos-validar-pago';
  var q = new URLSearchParams(location.search);
  var codigo = q.get('c') || '', token = q.get('t') || '';
  // El token se saca de la URL más abajo; se guarda en la pestaña para que recargar no rompa la página.
  try {
    if (codigo && token) sessionStorage.setItem('em-validar', JSON.stringify({ c: codigo, t: token }));
    else { var g = JSON.parse(sessionStorage.getItem('em-validar') || 'null'); if (g) { codigo = g.c; token = g.t; } }
  } catch (e) {}
  var vista = document.getElementById('vista'), cargando = document.getElementById('cargando');
  var ocupado = false;

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
  function soles(n){ return 'S/ ' + Number(n || 0).toLocaleString('es-PE', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }
  function mostrar(html){ cargando.classList.add('hide'); vista.innerHTML = html; vista.classList.remove('hide'); }
  function fila(k, v){ return '<div class="row"><span>' + k + '</span><span>' + v + '</span></div>'; }

  function resumen(r){
    return '<div class="resumen"><div class="cod">Reserva ' + esc(r.codigo) + '</div>'
      + fila('Huésped', esc(r.nombre))
      + fila('Glamping', esc(r.carpa) + ' · ' + esc(r.pax) + ' pers.')
      + fila('Fechas', esc(r.llegada) + ' al ' + esc(r.salida))
      + fila('Total', soles(r.total))
      + fila('Medio que indicó', esc(r.medio))
      + fila('Operación que dio', r.referencia ? esc(r.referencia) : '<i>no la dio</i>')
      + (r.avisado ? fila('Avisó el', esc(r.avisado)) : '')
      + '</div>';
  }

  function final(tipo, titulo, texto, r){
    mostrar('<div class="estado"><div class="ico ' + tipo + '">' + (tipo === 'ok' ? '✓' : tipo === 'bad' ? '✕' : '!') + '</div>'
      + '<h1>' + titulo + '</h1><p>' + texto + '</p></div>' + (r ? resumen(r) : ''));
  }

  function llamar(accion, extra){
    var body = { codigo: codigo, t: token, accion: accion };
    for (var k in extra) body[k] = extra[k];
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function(res){ return res.json(); });
  }

  function pintar(resp){
    if (!resp || resp.ok === false) {
      final('bad', 'No se pudo abrir', esc((resp && resp.mensaje) || 'Este enlace no es válido.'));
      return;
    }
    var r = resp.reserva || {};
    if (r.estado === 'pagada') { final('ok', 'Pago confirmado', 'Esta reserva ya figura <b>PAGADA</b> y al huésped le llegó su correo de confirmación.', r); return; }
    if (r.estado === 'liberada') { final('warn', 'Reserva liberada', 'Esta reserva se liberó' + (r.fecha_liberacion ? ' el ' + esc(r.fecha_liberacion) : '') + ': la carpa volvió a la venta.', r); return; }
    if (r.estado !== 'verificando' || resp.usado) { final('warn', 'Nada que validar', 'Esta reserva ya no está esperando una verificación de pago.', r); return; }

    mostrar('<h1>¿Llegó este adelanto?</h1>'
      + '<p class="muted">Revisa tu Yape o la cuenta antes de confirmar. La carpa sigue apartada mientras decides.</p>'
      + '<div class="monto"><div class="lbl">Adelanto esperado</div><div class="val">' + soles(r.adelanto) + '</div></div>'
      + resumen(r)
      + '<label for="ref">N.° de operación que ves en tu Yape o banco</label>'
      + '<input id="ref" inputmode="numeric" autocomplete="off" maxlength="40" value="' + esc(r.referencia || '') + '" placeholder="Ej. 12345678">'
      + '<button class="btn" id="si">Sí llegó · confirmar la reserva</button>'
      + '<button class="btn rojo" id="no">No llegó · liberar la carpa</button>'
      + '<div class="paso">Si todavía no lo ves, <b>no toques nada</b>: el sistema te lo recuerda cada 2 horas y la carpa no se libera sola.</div>'
      + '<div id="msg"></div>');

    document.getElementById('si').onclick = function(){
      if (ocupado) return;
      if (!confirm('¿Confirmas que llegó ' + soles(r.adelanto) + '? Al huésped le llega el correo de reserva confirmada.')) return;
      accionar('confirmar', { referencia: document.getElementById('ref').value.trim() });
    };
    document.getElementById('no').onclick = function(){
      if (ocupado) return;
      if (!confirm('¿Seguro que el pago NO llegó? La carpa vuelve a la venta y se le avisa al huésped.')) return;
      accionar('liberar', {});
    };
  }

  function accionar(accion, extra){
    ocupado = true;
    var botones = vista.querySelectorAll('button');
    for (var i = 0; i < botones.length; i++) botones[i].disabled = true;
    llamar(accion, extra).then(function(resp){
      if (resp && resp.ok === false && resp.error === 'no_se_pudo_confirmar') {
        ocupado = false;
        for (var i = 0; i < botones.length; i++) botones[i].disabled = false;
        document.getElementById('msg').innerHTML = '<div class="err">' + esc(resp.mensaje) + '</div>';
        return;
      }
      pintar(resp);
    }).catch(function(){
      ocupado = false;
      for (var i = 0; i < botones.length; i++) botones[i].disabled = false;
      document.getElementById('msg').innerHTML = '<div class="err">No hay conexión. Revisa tu internet e inténtalo otra vez: no se hizo ningún cambio.</div>';
    });
  }

  if (!codigo || !token) { final('bad', 'Enlace incompleto', 'Abre esta página desde el botón del correo de "Pago por verificar".'); return; }
  // Se quita el token de la barra de direcciones para que no quede a la vista ni en capturas.
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  llamar('info', {}).then(pintar).catch(function(){ final('bad', 'Sin conexión', 'No pudimos cargar la reserva. Revisa tu internet y vuelve a abrir el enlace del correo.'); });
})();
</script>
</body>
</html>
